# Deploys main after CI passes: the web app to Hostinger over FTPS, the backend to Firebase.
# Each part runs only once its secrets exist (repo Settings → Secrets and variables → Actions),
# so this workflow does nothing until it is set up. See README, "Automatic deploy".
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # What may deploy: main only, after a green CI of a push to this repository (never a fork's pull
  # request, whose branch can also be called main). A manual run is main only and runs the gates.
  gate:
    name: Gate
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: CI already passed
        if: github.event_name == 'workflow_run'
        run: echo "CI passed for ${{ github.event.workflow_run.head_sha }}."
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - name: Lint, types and builds
        if: github.event_name == 'workflow_dispatch'
        env:
          VITE_FIREBASE_API_KEY: ci
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-flf-hub
          VITE_FIREBASE_STORAGE_BUCKET: ci
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: ci
        run: |
          npm ci && npm ci --prefix functions
          npm run lint && npm run check && npm run build && npm --prefix functions run build

  backend:
    name: Firebase (functions, rules, indexes)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Not set up
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "FIREBASE_SERVICE_ACCOUNT is not set; skipping the backend deploy."
      - uses: actions/checkout@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: google-github-actions/auth@v2
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          npm ci --prefix functions
          npx --yes firebase-tools@15 deploy --only functions,firestore:rules,firestore:indexes --project flfhub --non-interactive --force

  web:
    name: Web app (Hostinger)
    # After the backend, so a new page never goes live calling actions not deployed yet; not at all
    # when the backend deploy failed (skipped while it isn't set up is fine).
    needs: [gate, backend]
    if: always() && needs.gate.result == 'success' && needs.backend.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
      # Folder of the hub. subdomain, relative to the FTP account's root (e.g. `/` or `public_html/hub`).
      FTP_DIR: ${{ vars.HOSTINGER_FTP_DIR || '/' }}
    steps:
      - name: Not set up
        if: env.FTP_SERVER == ''
        run: echo "HOSTINGER_FTP_SERVER is not set; skipping the web deploy."
      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: env.FTP_SERVER != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build
        if: env.FTP_SERVER != ''
        # The Firebase web config is public (it ships in the page); kept in repo variables.
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || { echo "Set the VITE_FIREBASE_* repo variables."; exit 1; }
          npm ci
          npm run build
      - name: Upload over FTPS
        if: env.FTP_SERVER != ''
        # Old hashed files under _app/immutable are removed only after the new ones are up,
        # so a page open during the upload keeps working.
        # Hostinger's FTP certificate is not issued for ftp.<domain>, so the host name check fails;
        # instead the certificate is pinned by its SHA-1 fingerprint. When Hostinger renews it the
        # upload fails safely: set the new fingerprint (printed in the error) as HOSTINGER_FTP_CERT_SHA1.
        env:
          CERT_SHA1: ${{ vars.HOSTINGER_FTP_CERT_SHA1 || 'D5:F8:12:83:AA:BE:1E:92:51:FF:84:B3:A5:65:D6:51:91:C9:A5:28' }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-force true; set net:max-retries 3; set ssl:verify-certificate/$CERT_SHA1 no;
            mirror -R --parallel=4 --exclude-glob .DS_Store build/_app '$FTP_DIR/_app';
            mirror -R --parallel=4 --exclude-glob .DS_Store --exclude ^_app/ build '$FTP_DIR';
            mirror -R --delete --parallel=4 build/_app '$FTP_DIR/_app';
            bye"
